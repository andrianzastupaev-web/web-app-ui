<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Редагувати анкету — Circles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }

        body {
            min-height: 100vh;
            background: #15151f;
            color: #fff;
            padding: 16px 16px calc(88px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .topbar h1 { font-size: 18px; font-weight: 700; }
        .topbar a.back { color: #8a8aa0; text-decoration: none; font-size: 13px; }

        .card {
            background: #1d1d2e;
            border-radius: 16px;
            padding: 16px;
        }

        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #a8a8bd; margin-bottom: 5px; }
        .field input, .field textarea {
            width: 100%;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid #33334a;
            background: #15151f;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .field input:focus, .field textarea:focus { border-color: #7c3aed; }
        .field textarea { resize: vertical; min-height: 80px; }
        .field .hint { font-size: 11px; color: #6d6d84; margin-top: 3px; }

        .row { display: flex; gap: 10px; }
        .row .field { flex: 1; }

        .photos-row { display: flex; gap: 10px; }
        .photo-slot {
            position: relative;
            flex: 1;
            aspect-ratio: 3/4;
            border-radius: 12px;
            border: 2px dashed #3a3a55;
            background: #15151f;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        .photo-slot.filled { border-style: solid; border-color: #7c3aed; }
        .photo-slot .plus { font-size: 30px; color: #4a4a68; }
        .photo-slot img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .photo-slot .remove {
            position: absolute;
            top: 5px; right: 5px;
            width: 26px; height: 26px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 14px;
            line-height: 1;
            display: none;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; }

        .switch-row { display: flex; justify-content: space-between; align-items: center; }
        .switch-row label:first-child { font-size: 13px; font-weight: 600; color: #a8a8bd; }
        .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider {
            position: absolute; inset: 0; border-radius: 999px;
            background: #33334a; cursor: pointer;
        }
        .switch .slider:before {
            content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%;
            background: #fff; top: 3px; left: 3px;
        }
        .switch input:checked + .slider { background: #7c3aed; }
        .switch input:checked + .slider:before { transform: translateX(20px); }

        .error-box {
            display: none;
            background: #3d1520;
            border: 1px solid #7c2d44;
            border-radius: 10px;
            padding: 10px 13px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .success-screen { display: none; text-align: center; padding: 40px 10px; }
        .success-screen .emoji { font-size: 52px; }
        .success-screen h2 { font-size: 18px; margin: 12px 0 6px; }
        .success-screen p { font-size: 13px; color: #8a8aa0; }
        .success-screen .cta {
            display: inline-block;
            margin-top: 14px;
            padding: 13px 26px;
            border-radius: 12px;
            background: #7c3aed;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .bottom-nav {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: space-between;
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
            background: #101018;
            border-top: 1px solid #26263a;
            z-index: 10;
        }
        .bottom-nav a {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            text-decoration: none;
            background: #1d1d2e;
        }
        .bottom-nav a.current { background: #35355a; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Редагування анкети</h1>
        <a class="back" href="index.html">← Мій профіль</a>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="card" id="formCard">
        <div class="field">
            <label>Фото (до 2 шт.)</label>
            <div class="photos-row">
                <div class="photo-slot" id="slot0">
                    <input type="file" accept="image/*" id="pick0" hidden>
                    <div class="plus">＋</div>
                    <img alt="" id="prev0">
                    <button class="remove" id="rm0" type="button">×</button>
                </div>
                <div class="photo-slot" id="slot1">
                    <input type="file" accept="image/*" id="pick1" hidden>
                    <div class="plus">＋</div>
                    <img alt="" id="prev1">
                    <button class="remove" id="rm1" type="button">×</button>
                </div>
            </div>
            <div class="hint">Натисни на рамку, щоб додати або замінити фото</div>
        </div>

        <div class="field">
            <label for="fName">Ім'я *</label>
            <input id="fName" type="text" maxlength="40" placeholder="Як тебе звати?">
        </div>

        <div class="row">
            <div class="field">
                <label for="fAge">Вік *</label>
                <input id="fAge" type="number" min="16" max="99" placeholder="18">
            </div>
            <div class="field">
                <label for="fCity">Місто</label>
                <input id="fCity" type="text" maxlength="40" placeholder="Київ">
            </div>
        </div>

        <div class="field">
            <label for="fBio">Про себе</label>
            <textarea id="fBio" maxlength="300" placeholder="Кава, музика, прогулянки ☕"></textarea>
            <div class="hint"><span id="bioCounter">0</span>/300 символів</div>
        </div>

        <div class="field">
            <div class="switch-row">
                <label>Показувати @username в анкеті</label>
                <label class="switch">
                    <input type="checkbox" id="fShowUsername" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="hint">Якщо вимкнено — анкету побачать, але без твого юзернейму</div>
        </div>

        <button class="btn" id="saveBtn">Зберегти анкету 💾</button>
    </div>

    <div class="success-screen" id="successScreen">
        <div class="emoji">✅</div>
        <h2>Анкету збережено!</h2>
        <p>Твої дані оновлено</p>
        <a class="cta" href="search.html?v=11">🔍 Дивитися анкети</a>
    </div>

    <nav class="bottom-nav">
        <a href="search.html?v=11" title="Пошук анкет">🔍</a>
        <a href="index.html" title="Мій профіль">👤</a>
        <a href="bottle.html?v=24" title="Пляшечка">🍾</a>
    </nav>

    <script>
        // === Налаштування Supabase (підставлено автоматично з .env) ===
        const SUPABASE_URL = 'https://qkrrskhzrffzlnvqforg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrcnJza2h6cmZmemxudnFmb3JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4NzksImV4cCI6MjEwNDU0Njg3OX0.I-fQI5XkcrgF8-zINlqv-eYuvSaHCQjzkaLu8ueEwd4';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const BUCKET = 'photos';

        const tg = window.Telegram?.WebApp;
        const tgUser = tg?.initDataUnsafe?.user;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const errorBox = document.getElementById('errorBox');
        const saveBtn = document.getElementById('saveBtn');

        function showError(text) {
            errorBox.textContent = text;
            errorBox.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        const photos = [null, null];
        let existingPhotos = [null, null];

        function showPreview(i, src) {
            const prev = document.getElementById('prev' + i);
            prev.src = src;
            prev.style.display = 'block';
            document.getElementById('slot' + i).classList.add('filled');
            document.getElementById('rm' + i).style.display = 'block';
        }

        function clearSlot(i) {
            photos[i] = null;
            existingPhotos[i] = null;
            const prev = document.getElementById('prev' + i);
            prev.style.display = 'none';
            prev.src = '';
            document.getElementById('slot' + i).classList.remove('filled');
            document.getElementById('rm' + i).style.display = 'none';
        }

        async function prepareImage(file) {
            try {
                const bitmap = await createImageBitmap(file);
                const maxSide = 1280;
                const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
                const w = Math.round(bitmap.width * scale);
                const h = Math.round(bitmap.height * scale);
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
                return blob || file;
            } catch (e) {
                return file;
            }
        }

        for (let i = 0; i < 2; i++) {
            const slot = document.getElementById('slot' + i);
            const pick = document.getElementById('pick' + i);
            const rm = document.getElementById('rm' + i);

            slot.addEventListener('click', function (e) {
                if (e.target === rm) return;
                pick.click();
            });

            pick.addEventListener('change', async function () {
                const file = this.files[0];
                this.value = '';
                if (!file) return;
                if (!file.type.startsWith('image/')) return showError('Можна додавати лише зображення 📷');
                photos[i] = await prepareImage(file);
                showPreview(i, URL.createObjectURL(photos[i]));
                errorBox.style.display = 'none';
            });

            rm.addEventListener('click', function () { clearSlot(i); });
        }

        async function uploadPhoto(index) {
            const blob = photos[index];
            if (!blob) return null;
            const path = 'users/' + tgUser.id + '/' + Date.now() + '_' + index + '.jpg';
            const { error } = await sb.storage.from(BUCKET).upload(path, blob, {
                contentType: 'image/jpeg'
            });
            if (error) throw error;
            const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
            return data.publicUrl;
        }

        async function loadMyProfile() {
            const { data: me, error } = await sb.from('users')
                .select('*').eq('user_id', tgUser.id).maybeSingle();
            if (error || !me) return;

            if (me.first_name) document.getElementById('fName').value = me.first_name;
            if (me.age) document.getElementById('fAge').value = me.age;
            if (me.city) document.getElementById('fCity').value = me.city;
            if (me.bio) {
                document.getElementById('fBio').value = me.bio;
                document.getElementById('bioCounter').textContent = me.bio.length;
            }
            document.getElementById('fShowUsername').checked = me.show_username !== false;
            existingPhotos = [me.photo_url || null, me.photo_url2 || null];
            existingPhotos.forEach(function (url, i) { if (url) showPreview(i, url); });
        }

        if (!tgUser) {
            document.getElementById('formCard').style.display = 'none';
            showError('Ця сторінка працює лише всередині Telegram. Відкрий бота і натисни 💫');
        } else {
            document.getElementById('fName').value = tgUser.first_name || '';
            loadMyProfile();
        }

        document.getElementById('fBio').addEventListener('input', function () {
            document.getElementById('bioCounter').textContent = this.value.length;
        });

        saveBtn.addEventListener('click', async function () {
            errorBox.style.display = 'none';

            const name = document.getElementById('fName').value.trim();
            const age = parseInt(document.getElementById('fAge').value, 10);
            const city = document.getElementById('fCity').value.trim();
            const bio = document.getElementById('fBio').value.trim();

            if (!name) return showError('Вкажи імʼя 🙂');
            if (!age || age < 16 || age > 99) return showError('Вік має бути від 16 до 99');

            saveBtn.disabled = true;
            saveBtn.textContent = 'Зберігаю... ⏳';

            try {
                let photoUrl, photoUrl2;
                if (photos[0] || photos[1]) saveBtn.textContent = 'Завантажую фото... 📷';
                photoUrl = photos[0] ? await uploadPhoto(0) : existingPhotos[0];
                photoUrl2 = photos[1] ? await uploadPhoto(1) : existingPhotos[1];

                saveBtn.textContent = 'Зберігаю... ⏳';
                const { error } = await sb.from('users').upsert({
                    user_id: tgUser.id,
                    username: tgUser.username || null,
                    first_name: name,
                    age: age,
                    city: city || null,
                    bio: bio || null,
                    photo_url: photoUrl,
                    photo_url2: photoUrl2,
                    show_username: document.getElementById('fShowUsername').checked
                }, { onConflict: 'user_id' });

                if (error) throw error;

                try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (e) {}

                document.getElementById('formCard').style.display = 'none';
                document.getElementById('successScreen').style.display = 'block';
            } catch (err) {
                console.error(err);
                try { tg?.HapticFeedback?.notificationOccurred('error'); } catch (e) {}
                showError('Не вдалося зберегти анкету 😔 Спробуй ще раз');
                saveBtn.disabled = false;
                saveBtn.textContent = 'Зберегти анкету 💾';
            }
        });
    </script>
</body>
</html>
