<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Моя анкета — KNEU | Circles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #2d1b4e 100%);
            color: #fff;
            padding: 24px 16px 40px;
        }

        .header { text-align: center; margin-bottom: 28px; }
        .header .logo { font-size: 40px; }
        .header h1 { font-size: 22px; font-weight: 700; margin-top: 8px; }
        .header p { font-size: 14px; opacity: 0.6; margin-top: 6px; }

        .card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; opacity: 0.8; margin-bottom: 6px; }
        .field input, .field textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus, .field textarea:focus { border-color: #e94e77; }
        .field textarea { resize: vertical; min-height: 88px; }
        .field .hint { font-size: 11px; opacity: 0.45; margin-top: 4px; }

        .row { display: flex; gap: 12px; }
        .row .field { flex: 1; }

        .photos-row { display: flex; gap: 12px; }
        .photo-slot {
            position: relative;
            flex: 1;
            aspect-ratio: 3/4;
            border-radius: 14px;
            border: 1.5px dashed rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .photo-slot.filled { border-style: solid; border-color: #e94e77; }
        .photo-slot .plus { font-size: 34px; opacity: 0.4; }
        .photo-slot img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .photo-slot .remove {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 15px;
            line-height: 1;
            display: none;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #e94e77, #b83060);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: wait; }

        .link-btn {
            display: block;
            text-align: center;
            margin-top: 14px;
            padding: 13px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            opacity: 0.85;
        }

        .error-box {
            display: none;
            background: rgba(233, 78, 119, 0.15);
            border: 1px solid rgba(233, 78, 119, 0.5);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .success-screen { display: none; text-align: center; padding: 40px 10px; }
        .success-screen .emoji { font-size: 56px; }
        .success-screen h2 { font-size: 20px; margin: 16px 0 8px; }
        .success-screen p { font-size: 14px; opacity: 0.7; line-height: 1.5; }
        .success-screen .link-btn { margin-top: 20px; border: none; background: linear-gradient(90deg, #8e44ad, #5b2c8d); opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎓💫</div>
        <h1>Моя анкета</h1>
        <p id="greeting">Заповни — і тебе побачать інші студенти KNEU</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="card" id="formCard">
        <div class="field">
            <label>Фото (до 2 шт.)</label>
            <div class="photos-row">
                <div class="photo-slot" id="slot0">
                    <input type="file" accept="image/*" id="pick0" hidden>
                    <div class="plus">＋</div>
                    <img alt="" id="prev0">
                    <button class="remove" id="rm0" type="button">×</button>
                </div>
                <div class="photo-slot" id="slot1">
                    <input type="file" accept="image/*" id="pick1" hidden>
                    <div class="plus">＋</div>
                    <img alt="" id="prev1">
                    <button class="remove" id="rm1" type="button">×</button>
                </div>
            </div>
            <div class="hint">Натисни на рамку, щоб додати або замінити фото</div>
        </div>

        <div class="field">
            <label for="fName">Ім'я *</label>
            <input id="fName" type="text" maxlength="40" placeholder="Як тебе звати?">
        </div>

        <div class="row">
            <div class="field">
                <label for="fAge">Вік *</label>
                <input id="fAge" type="number" min="16" max="99" placeholder="18">
            </div>
            <div class="field">
                <label for="fFaculty">Факультет *</label>
                <input id="fFaculty" type="text" maxlength="60" list="faculties" placeholder="Обери або введи">
                <datalist id="faculties">
                    <option value="Маркетингу"></option>
                    <option value="Фінансів"></option>
                    <option value="Обліку і економіки підприємництва"></option>
                    <option value="Економіки та права"></option>
                    <option value="Міжнародної економіки і менеджменту"></option>
                    <option value="Економічної кібернетики"></option>
                </datalist>
            </div>
        </div>

        <div class="field">
            <label for="fBio">Про себе</label>
            <textarea id="fBio" maxlength="300" placeholder="Люблю каву біля першого корпусу ☕"></textarea>
            <div class="hint"><span id="bioCounter">0</span>/300 символів</div>
        </div>

        <button class="btn" id="saveBtn">Зберегти анкету 💾</button>
        <a class="link-btn" href="/">🍾 Крутити пляшечку</a>
    </div>

    <div class="success-screen" id="successScreen">
        <div class="emoji">✅</div>
        <h2>Анкету збережено!</h2>
        <p>Твої дані оновлено</p>
        <a class="link-btn" href="/">🍾 Крутити пляшечку</a>
    </div>

    <script>
        // === Налаштування Supabase (підставлено автоматично з .env) ===
        const SUPABASE_URL = 'https://qkrrskhzrffzlnvqforg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrcnJza2h6cmZmemxudnFmb3JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4NzksImV4cCI6MjEwNDU0Njg3OX0.I-fQI5XkcrgF8-zINlqv-eYuvSaHCQjzkaLu8ueEwd4';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const BUCKET = 'photos';

        const tg = window.Telegram?.WebApp;
        const tgUser = tg?.initDataUnsafe?.user;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const errorBox = document.getElementById('errorBox');
        const saveBtn = document.getElementById('saveBtn');

        function showError(text) {
            errorBox.textContent = text;
            errorBox.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // === Фото: нові вибрані (Blob) + збережені раніше (URL) ===
        const photos = [null, null];          // щойно обрані файли
        let existingPhotos = [null, null];    // URL з бази (якщо анкета вже є)

        function showPreview(i, src) {
            const prev = document.getElementById('prev' + i);
            prev.src = src;
            prev.style.display = 'block';
            document.getElementById('slot' + i).classList.add('filled');
            document.getElementById('rm' + i).style.display = 'block';
        }

        function clearSlot(i) {
            photos[i] = null;
            existingPhotos[i] = null;
            const prev = document.getElementById('prev' + i);
            prev.style.display = 'none';
            prev.src = '';
            document.getElementById('slot' + i).classList.remove('filled');
            document.getElementById('rm' + i).style.display = 'none';
        }

        // Стискаємо фото до 1280px (JPEG) — щоб швидко вантажилося з телефону
        async function prepareImage(file) {
            try {
                const bitmap = await createImageBitmap(file);
                const maxSide = 1280;
                const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
                const w = Math.round(bitmap.width * scale);
                const h = Math.round(bitmap.height * scale);
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
                const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
                return blob || file;
            } catch (e) {
                return file;
            }
        }

        for (let i = 0; i < 2; i++) {
            const slot = document.getElementById('slot' + i);
            const pick = document.getElementById('pick' + i);
            const rm = document.getElementById('rm' + i);

            slot.addEventListener('click', function (e) {
                if (e.target === rm) return;
                pick.click();
            });

            pick.addEventListener('change', async function () {
                const file = this.files[0];
                this.value = '';
                if (!file) return;
                if (!file.type.startsWith('image/')) return showError('Можна додавати лише зображення 📷');
                photos[i] = await prepareImage(file);
                showPreview(i, URL.createObjectURL(photos[i]));
                errorBox.style.display = 'none';
            });

            rm.addEventListener('click', function () { clearSlot(i); });
        }

        // Завантаження нового фото в Storage, повертає публічний URL
        async function uploadPhoto(index) {
            const blob = photos[index];
            if (!blob) return null;
            const path = 'users/' + tgUser.id + '/' + Date.now() + '_' + index + '.jpg';
            const { error } = await sb.storage.from(BUCKET).upload(path, blob, {
                contentType: 'image/jpeg'
            });
            if (error) throw error;
            const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
            return data.publicUrl;
        }

        // === Завантаження існуючої анкети ===
        async function loadMyProfile() {
            const { data: me, error } = await sb.from('users')
                .select('*').eq('user_id', tgUser.id).maybe_single();
            if (error || !me) return;

            if (me.first_name) document.getElementById('fName').value = me.first_name;
            if (me.age) document.getElementById('fAge').value = me.age;
            if (me.faculty) document.getElementById('fFaculty').value = me.faculty;
            if (me.bio) {
                document.getElementById('fBio').value = me.bio;
                document.getElementById('bioCounter').textContent = me.bio.length;
            }
            existingPhotos = [me.photo_url || null, me.photo_url2 || null];
            existingPhotos.forEach(function (url, i) { if (url) showPreview(i, url); });
        }

        if (!tgUser) {
            document.getElementById('formCard').style.display = 'none';
            showError('Ця сторінка працює лише всередині Telegram. Відкрий бота @KneuCirclesBot і натисни кнопку 🚀');
        } else {
            document.getElementById('greeting').textContent =
                (tgUser.first_name ? tgUser.first_name + ', тут' : 'Тут') +
                ' твоя анкета — редагуй у будь-який час';
            document.getElementById('fName').value = tgUser.first_name || '';
            loadMyProfile();
        }

        document.getElementById('fBio').addEventListener('input', function () {
            document.getElementById('bioCounter').textContent = this.value.length;
        });

        saveBtn.addEventListener('click', async function () {
            errorBox.style.display = 'none';

            const name = document.getElementById('fName').value.trim();
            const age = parseInt(document.getElementById('fAge').value, 10);
            const faculty = document.getElementById('fFaculty').value.trim();
            const bio = document.getElementById('fBio').value.trim();

            if (!name) return showError('Вкажи імʼя 🙂');
            if (!age || age < 16 || age > 99) return showError('Вік має бути від 16 до 99');
            if (!faculty) return showError('Вкажи факультет 🎓');

            saveBtn.disabled = true;
            saveBtn.textContent = 'Зберігаю... ⏳';

            try {
                // 1. Фото: нові завантажуємо, інакше лишаємо збережені
                let photoUrl, photoUrl2;
                if (photos[0] || photos[1]) saveBtn.textContent = 'Завантажую фото... 📷';
                photoUrl = photos[0] ? await uploadPhoto(0) : existingPhotos[0];
                photoUrl2 = photos[1] ? await uploadPhoto(1) : existingPhotos[1];

                // 2. Зберігаємо анкету
                saveBtn.textContent = 'Зберігаю... ⏳';
                const { error } = await sb.from('users').upsert({
                    user_id: tgUser.id,
                    username: tgUser.username || null,
                    first_name: name,
                    age: age,
                    faculty: faculty,
                    bio: bio || null,
                    photo_url: photoUrl,
                    photo_url2: photoUrl2
                }, { onConflict: 'user_id' });

                if (error) throw error;

                try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (e) {}

                document.getElementById('formCard').style.display = 'none';
                document.getElementById('successScreen').style.display = 'block';
            } catch (err) {
                console.error(err);
                try { tg?.HapticFeedback?.notificationOccurred('error'); } catch (e) {}
                showError('Не вдалося зберегти анкету 😔 Спробуй ще раз');
                saveBtn.disabled = false;
                saveBtn.textContent = 'Зберегти анкету 💾';
            }
        });
    </script>
</body>
</html>
