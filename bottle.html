<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Пляшечка — Circles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }

        body {
            min-height: 100vh;
            background: #15151f;
            color: #fff;
            padding: 14px 16px calc(84px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .topbar h1 { font-size: 18px; font-weight: 700; }
        .topbar a.back { color: #8a8aa0; text-decoration: none; font-size: 13px; }

        .status-line {
            display: table;
            margin: 0 auto 10px;
            padding: 6px 16px;
            border-radius: 10px;
            background: #1d1d2e;
            font-size: 13px;
            color: #c9c9da;
            min-height: 32px;
            text-align: center;
        }

        .placeholder { text-align: center; padding: 60px 16px; display: none; }
        .placeholder .emoji { font-size: 48px; }
        .placeholder h2 { font-size: 17px; margin: 12px 0 6px; }
        .placeholder p { font-size: 13px; color: #8a8aa0; line-height: 1.5; }
        .placeholder .cta {
            display: inline-block;
            margin-top: 16px;
            padding: 13px 26px;
            border-radius: 12px;
            background: #7c3aed;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        /* Ігровий стіл — простий і плоский */
        .arena {
            position: relative;
            width: 100%;
            max-width: 420px;
            max-width: min(420px, 100%, 46dvh);
            aspect-ratio: 1/1;
            margin: 0 auto;
        }
        .arena .table-circle {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #232338;
            border: 2px solid #35355a;
        }

        /* Гравці */
        .player {
            position: absolute;
            width: 88px;
            margin-left: -44px;
            margin-top: -44px;
            text-align: center;
            z-index: 3;
        }
        .player .avatar {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid #3d3d5c;
            background: #35355a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            margin: 0 auto;
            overflow: hidden;
        }
        .player .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .player .pname {
            display: table;
            margin: 4px auto 0;
            padding: 3px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.55);
            font-size: 12px;
            font-weight: 600;
            max-width: 88px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .player.me .avatar { border-color: #7c3aed; }
        .player.target .avatar { border-color: #ffd166; }
        .player.target .pname { color: #ffe9a8; }
        .player.spinner .avatar { border-color: #6ec8e8; }

        /* Пляшечка */
        .bottle {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100px;
            height: 100px;
            margin: -50px 0 0 -50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(0deg);
            transition: none;
            z-index: 2;
            user-select: none;
            will-change: transform;
        }
        .bottle svg { display: block; }

        /* Кнопка «Крутити» */
        .spin-btn {
            display: block;
            width: 100%;
            max-width: 420px;
            margin: 10px auto 0;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .spin-btn:disabled { opacity: 0.45; }

        /* Дії */
        .actions { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .actions button {
            flex: 1;
            min-width: 58px;
            max-width: 76px;
            padding: 10px 5px 8px;
            border: none;
            border-radius: 12px;
            background: #2a2a40;
            color: #fff;
            font-size: 21px;
            cursor: pointer;
        }
        .actions button:nth-child(2) { background: #c0265c; }
        .actions button:nth-child(4) { background: #b3412a; }
        .actions button small { display: block; font-size: 10px; margin-top: 3px; font-weight: 600; opacity: 0.85; }

        .leave-btn {
            display: block;
            width: 100%;
            max-width: 420px;
            margin: 6px auto 0;
            padding: 9px;
            border: 1px solid #33334a;
            border-radius: 10px;
            background: none;
            color: #8a8aa0;
            font-size: 13px;
            cursor: pointer;
        }

        /* Банер результату */
        .action-banner {
            visibility: hidden;
            max-width: 420px;
            margin: 6px auto 0;
            padding: 10px;
            min-height: 40px;
            border-radius: 10px;
            background: #2b2513;
            border: 1px solid #7c6a33;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #ffe9a8;
        }
        .action-banner.shown { visibility: visible; }

        /* Нижнє меню */
        .bottom-nav {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: space-between;
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
            background: #101018;
            border-top: 1px solid #26263a;
            z-index: 10;
        }
        .bottom-nav a {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            text-decoration: none;
            background: #1d1d2e;
        }
        .bottom-nav a.current { background: #35355a; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>🍾 Пляшечка</h1>
        <a class="back" href="index.html">← Мій профіль</a>
    </div>

    <div class="status-line" id="statusLine"></div>

    <div class="placeholder" id="needRegister">
        <div class="emoji">📝</div>
        <h2>Спочатку — анкета</h2>
        <p>Грають лише зареєстровані учасники</p>
        <a class="cta" href="edit.html?v=7">Заповнити анкету</a>
    </div>

    <div class="placeholder" id="gameFull">
        <div class="emoji">🚪</div>
        <h2>Гра повна</h2>
        <p>За столом уже 4 гравці. Спробуй пізніше!</p>
        <a class="cta" href="search.html?v=11">🔍 Пошук анкет</a>
    </div>

    <div class="placeholder" id="loading">
        <div class="emoji">⏳</div>
        <h2>Завантажую гру...</h2>
    </div>

    <div id="gameWrap">
        <div class="arena">
            <div class="table-circle"></div>
            <div class="bottle" id="bottle">
                <svg width="52" height="124" viewBox="0 0 58 138" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0" stop-color="#215f39"/>
                            <stop offset="0.45" stop-color="#3f9e63"/>
                            <stop offset="1" stop-color="#1c5231"/>
                        </linearGradient>
                    </defs>
                    <rect x="23.5" y="2" width="11" height="8" rx="2.5" fill="#f6e3b4"/>
                    <rect x="20.5" y="9" width="17" height="18" rx="4" fill="#d9a441"/>
                    <rect x="24" y="25" width="10" height="28" fill="url(#glass)"/>
                    <rect x="12.5" y="50" width="33" height="86" rx="12" fill="url(#glass)"/>
                    <rect x="16" y="55" width="5" height="76" rx="2.5" fill="#6ecb92" opacity="0.65"/>
                    <ellipse cx="29" cy="94" rx="12" ry="17" fill="#f8f1e0"/>
                    <text x="29" y="100" font-size="12" text-anchor="middle">💫</text>
                </svg>
            </div>
            <div id="playersLayer"></div>
        </div>

        <button class="spin-btn" id="spinBtn">🍾 Крутити!</button>

        <div class="actions" id="actions" style="display: none;">
            <button data-act="kiss">😘<small>поцілунок</small></button>
            <button data-act="heart">❤️<small>сердечко</small></button>
            <button data-act="dislike">👎<small>дизлайк</small></button>
            <button data-act="tomato">🍅<small>помідор</small></button>
        </div>

        <div class="action-banner" id="actionBanner"></div>

        <button class="leave-btn" id="leaveBtn">🚪 Залишити гру</button>
    </div>

    <nav class="bottom-nav">
        <a href="search.html?v=11" title="Пошук анкет">🔍</a>
        <a href="index.html" title="Мій профіль">👤</a>
        <a href="bottle.html?v=24" class="current" title="Пляшечка">🍾</a>
    </nav>

    <script>
        // === Налаштування Supabase (підставлено автоматично з .env) ===
        const SUPABASE_URL = 'https://qkrrskhzrffzlnvqforg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrcnJza2h6cmZmemxudnFmb3JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4NzksImV4cCI6MjEwNDU0Njg3OX0.I-fQI5XkcrgF8-zINlqv-eYuvSaHCQjzkaLu8ueEwd4';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const tg = window.Telegram?.WebApp;
        const tgUser = tg?.initDataUnsafe?.user;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const MAX_PLAYERS = 4;
        const POLL_MS = 1000;

        const els = {
            loading: document.getElementById('loading'),
            needRegister: document.getElementById('needRegister'),
            gameFull: document.getElementById('gameFull'),
            gameWrap: document.getElementById('gameWrap'),
            playersLayer: document.getElementById('playersLayer'),
            bottle: document.getElementById('bottle'),
            spinBtn: document.getElementById('spinBtn'),
            actions: document.getElementById('actions'),
            banner: document.getElementById('actionBanner'),
            leaveBtn: document.getElementById('leaveBtn'),
            statusLine: document.getElementById('statusLine'),
        };

        const ACTION_TEXT = {
            kiss: '😘 {a} поцілував(ла) {b}!',
            heart: '❤️ {a} віддає сердечко {b}',
            dislike: '👎 {a} ставить дизлайк {b}',
            tomato: '🍅 {a} кидає помідор у {b}!'
        };

        let game = null;
        let profiles = {};
        let advanceRound = -1;

        function show(el) {
            [els.loading, els.needRegister, els.gameFull, els.gameWrap].forEach(function (e) {
                e.style.display = 'none';
            });
            if (el) el.style.display = 'block';
        }

        function nameOf(id) {
            return profiles[id] ? (profiles[id].first_name || 'Учасник') : 'Учасник';
        }

        let lastRenderKey = '';

        function renderPlayers() {
            const list = game.players;
            const key = list.join(',') + '|' + (game.target || '') + '|' + (game.spinner || '');
            if (key === lastRenderKey) return;
            lastRenderKey = key;

            els.playersLayer.innerHTML = '';
            const R = 44;

            list.forEach(function (uid, i) {
                const ang = (i / list.length) * 360 * Math.PI / 180;
                const x = 50 + R * Math.cos(ang);
                const y = 50 + R * Math.sin(ang);

                const div = document.createElement('div');
                div.className = 'player'
                    + (uid === tgUser.id ? ' me' : '')
                    + (game.target === uid ? ' target' : '')
                    + (game.spinner === uid ? ' spinner' : '');
                div.style.left = x + '%';
                div.style.top = y + '%';

                const p = profiles[uid];
                const photo = p && (p.photo_url || p.photo_url2);
                div.innerHTML =
                    '<div class="avatar">' + (photo
                        ? '<img src="' + photo + '" alt="">'
                        : '👤') + '</div>'
                    + '<div class="pname">' + nameOf(uid) + '</div>';
                els.playersLayer.appendChild(div);
            });
        }

        // === Обертання: коротке й швидке (1.4 с), детерміноване ===
        let bottleDeg = 0;
        let animatedRound = -1;

        function animateBottle(fromDeg, toDeg, durationMs) {
            const t0 = performance.now();
            function frame(now) {
                const p = Math.min(1, (now - t0) / durationMs);
                const spin = 1 - Math.pow(1 - p, 3); // швидкий старт, швидке гальмування
                els.bottle.style.transform =
                    'rotate(' + (fromDeg + (toDeg - fromDeg) * spin) + 'deg)';
                if (p < 1) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        function pointBottle(targetIdx, count, round) {
            const target = (targetIdx / count) * 360 + 90;
            const current = ((bottleDeg % 360) + 360) % 360;
            let delta = target - current;
            if (delta <= 0) delta += 360;
            const turns = 2 + ((round + targetIdx) % 2);
            const newDeg = bottleDeg + turns * 360 + delta;

            if (animatedRound !== round) {
                animatedRound = round;
                animateBottle(bottleDeg, newDeg, 1400);
            }
            bottleDeg = newDeg;
        }

        // === Дії гравця ===
        els.spinBtn.addEventListener('click', async function () {
            if (!game || game.status !== 'waiting' || game.players.length < 2) return;
            const others = game.players.filter(function (u) { return u !== tgUser.id; });
            const target = others[Math.floor(Math.random() * others.length)];

            els.spinBtn.disabled = true;
            try {
                await sb.from('bottle_games').update({
                    status: 'spinning',
                    spinner: tgUser.id,
                    target: target,
                    action: null,
                    round: game.round + 1
                }).eq('id', game.id);
                pollNow();
            } catch (err) {
                console.error(err);
                els.spinBtn.disabled = false;
            }
        });

        els.actions.querySelectorAll('button').forEach(function (btn) {
            btn.addEventListener('click', async function () {
                if (!game || game.status !== 'spinning' || game.spinner !== tgUser.id) return;
                const act = btn.dataset.act;
                els.actions.style.display = 'none';
                try {
                    await sb.from('bottle_games').update({
                        status: 'result',
                        action: act
                    }).eq('id', game.id).eq('status', 'spinning');
                    pollNow();
                } catch (err) {
                    console.error(err);
                }
            });
        });

        els.leaveBtn.addEventListener('click', async function () {
            if (!game) return;
            const players = game.players.filter(function (u) { return u !== tgUser.id; });
            const patch = players.length === 0
                ? { status: 'finished', players: players }
                : { players: players };
            if (game.spinner === tgUser.id || game.target === tgUser.id) {
                patch.status = players.length >= 2 ? 'waiting' : (players.length === 0 ? 'finished' : 'waiting');
                patch.spinner = null;
                patch.target = null;
                patch.action = null;
            }
            await sb.from('bottle_games').update(patch).eq('id', game.id);
            window.location.href = 'index.html';
        });

        // === Рендер стану ===
        function render() {
            show(els.gameWrap);
            renderPlayers();

            const count = game.players.length;
            els.spinBtn.style.display = 'none';
            els.actions.style.display = 'none';
            els.banner.classList.remove('shown');

            if (game.status === 'waiting') {
                if (count < 2) {
                    els.statusLine.textContent = 'Чекаємо ще гравців... (' + count + '/' + MAX_PLAYERS + ')';
                    els.spinBtn.style.display = 'block';
                    els.spinBtn.disabled = true;
                    els.spinBtn.textContent = '⏳ Чекаємо гравців (потрібно 2+)';
                } else {
                    els.statusLine.textContent = 'Гравців: ' + count + '/' + MAX_PLAYERS + '. Крутить: ' + nameOf(game.spinner || game.players[0]);
                    els.spinBtn.style.display = 'block';
                    const myTurn = !(game.spinner && game.spinner !== tgUser.id);
                    els.spinBtn.disabled = !myTurn;
                    els.spinBtn.textContent = myTurn ? '🍾 Крутити!' : '⏳ ' + nameOf(game.spinner) + ' крутить...';
                }
            }

            if (game.status === 'spinning' || game.status === 'result') {
                const tIdx = game.players.indexOf(game.target);
                if (tIdx >= 0) pointBottle(tIdx, count, game.round);

                if (game.status === 'spinning') {
                    if (game.spinner === tgUser.id) {
                        els.statusLine.textContent = 'Пляшечка вказала на ' + nameOf(game.target) + '! Обери дію:';
                        els.actions.style.display = 'flex';
                    } else {
                        els.statusLine.textContent = nameOf(game.spinner) + ' обирає дію для ' + nameOf(game.target) + '...';
                    }
                }

                if (game.status === 'result' && game.action) {
                    els.banner.textContent = ACTION_TEXT[game.action]
                        .replace('{a}', nameOf(game.spinner))
                        .replace('{b}', nameOf(game.target));
                    els.banner.classList.add('shown');
                    els.statusLine.textContent = 'Наступним крутить: ' + nameOf(game.target);

                    if (advanceRound !== game.round) {
                        advanceRound = game.round;
                        setTimeout(async function () {
                            await sb.from('bottle_games').update({
                                status: 'waiting',
                                spinner: game.target,
                                target: null,
                                action: null
                            }).eq('id', game.id).eq('status', 'result');
                        }, 4000);
                    }
                }
            }
        }

        // === Опитування стану гри ===
        async function fetchGame() {
            const res = await sb.from('bottle_games')
                .select('*').neq('status', 'finished')
                .order('id', { ascending: false }).limit(1).maybeSingle();

            if (res.error) throw res.error;
            game = res.data;
            if (!game) {
                const created = await sb.from('bottle_games').insert({
                    host_id: tgUser.id,
                    players: [tgUser.id],
                    status: 'waiting'
                }).select().maybeSingle();
                if (created.error) throw created.error;
                game = created.data;
            } else if (game.players.indexOf(tgUser.id) === -1) {
                if (game.players.length >= MAX_PLAYERS) {
                    show(els.gameFull);
                    return;
                }
                const players = game.players.concat([tgUser.id]);
                await sb.from('bottle_games').update({ players: players }).eq('id', game.id);
                game.players = players;
            }

            if (game.players.length) {
                const pr = await sb.from('users').select('*').in('user_id', game.players);
                profiles = {};
                (pr.data || []).forEach(function (p) { profiles[p.user_id] = p; });
            }

            render();
        }

        // === Серцебиття (авто-вихід) ===
        let lastPing = 0;

        async function pingPresence() {
            if (!game || Date.now() - lastPing < 5000) return;
            lastPing = Date.now();
            try {
                await sb.from('bottle_presence').upsert({
                    user_id: tgUser.id,
                    game_id: game.id,
                    seen_at: new Date().toISOString()
                });
            } catch (err) {
                console.error(err);
            }
        }

        window.addEventListener('pagehide', function () {
            if (!tgUser || !game) return;
            try {
                fetch(SUPABASE_URL + '/rest/v1/bottle_presence?user_id=eq.' + tgUser.id, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
                    keepalive: true
                });
            } catch (e) {}
        });

        async function pollNow() {
            try {
                await fetchGame();
                await pingPresence();
            } catch (err) {
                console.error(err);
                var msg = (err && err.message) ? err.message : String(err);
                if (err && err.code) msg += ' [code ' + err.code + ']';
                els.statusLine.textContent = '⚠️ ' + msg;
            }
        }

        async function init() {
            if (!tgUser) {
                show(els.needRegister);
                return;
            }
            const { data: my } = await sb.from('users')
                .select('user_id').eq('user_id', tgUser.id).maybeSingle();
            if (!my) {
                show(els.needRegister);
                return;
            }
            show(els.loading);
            await pollNow();
            setInterval(pollNow, POLL_MS);
        }

        show(els.loading);
        init().catch(function (err) {
            console.error(err);
            var msg = (err && err.message) ? err.message : String(err);
            els.statusLine.textContent = '⚠️ ' + msg;
        });
    </script>
</body>
</html>
