<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Пошук — Circles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }

        body {
            min-height: 100vh;
            background: #15151f;
            color: #fff;
            padding: 16px 16px calc(88px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .topbar h1 { font-size: 18px; font-weight: 700; }
        .topbar a.back { color: #8a8aa0; text-decoration: none; font-size: 13px; }

        .placeholder { text-align: center; padding: 60px 16px; display: none; }
        .placeholder .emoji { font-size: 48px; }
        .placeholder h2 { font-size: 17px; margin: 12px 0 6px; }
        .placeholder p { font-size: 13px; color: #8a8aa0; line-height: 1.5; }
        .placeholder .cta {
            display: inline-block;
            margin-top: 16px;
            padding: 13px 26px;
            border-radius: 12px;
            background: #7c3aed;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        /* Картка анкети */
        .profile-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #1d1d2e;
        }
        .photo-area { position: relative; width: 100%; aspect-ratio: 3/4; }
        .photo-area .photo { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-area .photo-fallback {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px;
            background: #2a2a40;
        }
        .badge {
            position: absolute; top: 10px; left: 10px;
            padding: 5px 11px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.6);
            font-size: 12px; font-weight: 600;
        }
        .overlay {
            position: absolute; left: 0; right: 0; bottom: 0;
            padding: 48px 14px 14px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.7) 100%);
        }
        .overlay .name { font-size: 21px; font-weight: 700; }
        .overlay .meta { font-size: 13px; color: #cfcfdd; margin-top: 2px; }
        .overlay .bio { font-size: 13px; color: #d8d8e4; line-height: 1.45; margin-top: 7px; }

        /* Кнопки дій — прості й великі */
        .actions { display: flex; justify-content: center; gap: 16px; margin-top: 14px; }
        .actions button {
            width: 74px; height: 74px;
            border: none;
            border-radius: 16px;
            font-size: 30px;
            cursor: pointer;
        }
        .actions button:disabled { opacity: 0.4; }
        .btn-dislike { background: #2a2a40; }
        .btn-like { background: #c0265c; }

        .hint-line { text-align: center; margin-top: 8px; font-size: 11px; color: #6d6d84; }

        /* Нижнє меню */
        .bottom-nav {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: space-between;
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
            background: #101018;
            border-top: 1px solid #26263a;
            z-index: 10;
        }
        .bottom-nav a {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            text-decoration: none;
            background: #1d1d2e;
        }
        .bottom-nav a.current { background: #35355a; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>🔍 Пошук</h1>
        <a class="back" href="index.html">← Мій профіль</a>
    </div>

    <div class="placeholder" id="needRegister">
        <div class="emoji">📝</div>
        <h2>Спочатку — анкета</h2>
        <p>Заповни свою анкету, щоб почати знайомитися</p>
        <a class="cta" href="edit.html?v=6">Заповнити анкету</a>
    </div>

    <div class="placeholder" id="noMore">
        <div class="emoji">🤷‍♀️</div>
        <h2>Анкети закінчились</h2>
        <p>Ти переглянув усі нові анкети</p>
        <a class="cta" href="#" id="showAgain">🔄 Показати ще раз</a>
    </div>

    <div class="placeholder" id="loading">
        <div class="emoji">⏳</div>
        <h2>Завантажую анкети...</h2>
    </div>

    <div class="placeholder" id="loadError">
        <div class="emoji">⚠️</div>
        <h2>Не вдалося завантажити</h2>
        <p>Закрий і відкрий додаток ще раз</p>
    </div>

    <div id="deckWrap" style="display: none;">
        <div class="profile-card">
            <div class="photo-area" id="photoArea">
                <img class="photo" id="cPhoto" alt="">
                <div class="photo-fallback" id="cFallback">🙂</div>
                <span class="badge" id="cBadge"></span>
                <div class="overlay">
                    <div class="name" id="cName"></div>
                    <div class="meta" id="cMeta"></div>
                    <div class="bio" id="cBio"></div>
                </div>
            </div>
        </div>
        <div class="actions">
            <button class="btn-dislike" id="btnDislike" title="Не цікаво">❌</button>
            <button class="btn-like" id="btnLike" title="Сподобалось">❤️</button>
        </div>
    <nav class="bottom-nav">
        <a href="search.html?v=9" class="current" title="Пошук анкет">🔍</a>
        <a href="index.html" title="Мій профіль">👤</a>
        <a href="bottle.html?v=24" title="Пляшечка">🍾</a>
    </nav>

    <script>
        // === Налаштування Supabase (підставлено автоматично з .env) ===
        const SUPABASE_URL = 'https://qkrrskhzrffzlnvqforg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrcnJza2h6cmZmemxudnFmb3JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4NzksImV4cCI6MjEwNDU0Njg3OX0.I-fQI5XkcrgF8-zINlqv-eYuvSaHCQjzkaLu8ueEwd4';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const tg = window.Telegram?.WebApp;
        const tgUser = tg?.initDataUnsafe?.user;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const els = {
            loading: document.getElementById('loading'),
            loadError: document.getElementById('loadError'),
            needRegister: document.getElementById('needRegister'),
            noMore: document.getElementById('noMore'),
            deckWrap: document.getElementById('deckWrap'),
            photo: document.getElementById('cPhoto'),
            fallback: document.getElementById('cFallback'),
            photoArea: document.getElementById('photoArea'),
            name: document.getElementById('cName'),
            meta: document.getElementById('cMeta'),
            bio: document.getElementById('cBio'),
            badge: document.getElementById('cBadge'),
            like: document.getElementById('btnLike'),
            dislike: document.getElementById('btnDislike'),
        };

        function show(el) {
            [els.loading, els.loadError, els.needRegister, els.noMore, els.deckWrap].forEach(function (e) {
                e.style.display = 'none';
            });
            if (el) el.style.display = 'block';
        }

        let deck = [];
        let pos = 0;
        let busy = false;
        let photoIdx = 0;

        function cardPhotos(u) {
            return [u.photo_url, u.photo_url2].filter(Boolean);
        }

        function renderCard() {
            const u = deck[pos];
            const photos = cardPhotos(u);
            photoIdx = 0;

            if (photos.length) {
                els.photo.src = photos[0];
                els.photo.style.display = 'block';
                els.fallback.style.display = 'none';
            } else {
                els.photo.style.display = 'none';
                els.fallback.style.display = 'flex';
            }

            els.name.textContent = (u.first_name || 'Учасник') + (u.age ? ', ' + u.age : '');
            els.meta.textContent = u.city ? '📍 ' + u.city : '';
            els.bio.textContent = u.bio ? '“' + u.bio + '”' : '';
            els.bio.style.display = u.bio ? 'block' : 'none';
            const showName = u.username && u.show_username !== false;
            els.badge.textContent = showName ? '@' + u.username : '';
            els.badge.style.display = showName ? 'block' : 'none';
        }

        els.photoArea.addEventListener('click', function () {
            const photos = cardPhotos(deck[pos]);
            if (photos.length < 2) return;
            photoIdx = (photoIdx + 1) % photos.length;
            els.photo.src = photos[photoIdx];
        });

        // Миттєва реакція: тиск → одразу наступна анкета
        function react(kind) {
            if (busy) return;
            busy = true;
            const current = deck[pos];
            sb.from('reactions').upsert({
                from_user: tgUser.id,
                to_user: current.user_id,
                kind: kind,
                notified: false
            }, { onConflict: 'from_user,to_user' }).then(function () {}, console.error);
            try { tg?.HapticFeedback?.notificationOccurred(kind === 'like' ? 'success' : 'warning'); } catch (e) {}

            pos += 1;
            if (pos >= deck.length) {
                show(els.noMore);
            } else {
                renderCard();
            }
            busy = false;
        }

        els.like.addEventListener('click', function () { react('like'); });
        els.dislike.addEventListener('click', function () { react('dislike'); });

        async function loadDeck(showRatedAgain) {
            const rated = await sb.from('reactions')
                .select('to_user').eq('from_user', tgUser.id);
            const seen = new Set((rated.data || []).map(function (r) { return r.to_user; }));

            const all = await sb.from('users')
                .select('*').order('created_at', { ascending: false }).limit(100);

            deck = (all.data || []).filter(function (u) {
                return u.user_id !== tgUser.id
                    && (showRatedAgain || !seen.has(u.user_id));
            });
            pos = 0;

            if (deck.length === 0) {
                show(els.noMore);
            } else {
                show(els.deckWrap);
                renderCard();
            }
        }

        async function init() {
            if (!tgUser) {
                show(els.needRegister);
                return;
            }

            const { data: me } = await sb.from('users')
                .select('user_id').eq('user_id', tgUser.id).maybeSingle();
            if (!me) {
                show(els.needRegister);
                return;
            }

            await loadDeck(false);
        }

        document.getElementById('showAgain').addEventListener('click', async function (e) {
            e.preventDefault();
            show(els.loading);
            try {
                await loadDeck(true);
            } catch (err) {
                console.error(err);
                show(els.loadError);
            }
        });

        show(els.loading);
        init().catch(function (err) {
            console.error(err);
            show(els.loadError);
        });
    </script>
</body>
</html>
