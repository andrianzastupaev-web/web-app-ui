<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мій профіль — Circles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; touch-action: manipulation; }

        body {
            min-height: 100vh;
            background: #15151f;
            color: #fff;
            padding: 16px 16px calc(88px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .topbar h1 { font-size: 18px; font-weight: 700; }
        .topbar span { color: #8a8aa0; font-size: 13px; font-weight: 400; }
        .topbar a.back { color: #8a8aa0; text-decoration: none; font-size: 13px; }

        .placeholder { text-align: center; padding: 60px 16px; display: none; }
        .placeholder .emoji { font-size: 48px; }
        .placeholder h2 { font-size: 17px; margin: 12px 0 6px; }
        .placeholder p { font-size: 13px; color: #8a8aa0; line-height: 1.5; }
        .placeholder .cta {
            display: inline-block;
            margin-top: 16px;
            padding: 13px 26px;
            border-radius: 12px;
            background: #7c3aed;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        /* Картка профілю */
        .profile-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #1d1d2e;
        }
        .photo-area { position: relative; width: 100%; aspect-ratio: 3/4; }
        .photo-area .photo { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-area .photo-fallback {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px;
            background: #2a2a40;
        }
        .badge {
            position: absolute; top: 10px; left: 10px;
            padding: 5px 11px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.6);
            font-size: 12px; font-weight: 600;
        }
        .overlay {
            position: absolute; left: 0; right: 0; bottom: 0;
            padding: 48px 14px 14px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.7) 100%);
        }
        .overlay .name { font-size: 21px; font-weight: 700; }
        .overlay .meta { font-size: 13px; color: #cfcfdd; margin-top: 2px; }
        .overlay .bio { font-size: 13px; color: #d8d8e4; line-height: 1.45; margin-top: 7px; }

        .edit-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #7c3aed;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }
        .view-hint { text-align: center; margin-top: 8px; font-size: 11px; color: #6d6d84; }

        /* Нижнє меню — просте й стабільне */
        .bottom-nav {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: space-between;
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
            background: #101018;
            border-top: 1px solid #26263a;
            z-index: 10;
        }
        .bottom-nav a {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            text-decoration: none;
            background: #1d1d2e;
        }
        .bottom-nav a.current { background: #35355a; }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>💫 Circles <span>— мій профіль</span></h1>
    </div>

    <div class="placeholder" id="needRegister">
        <div class="emoji">📝</div>
        <h2>Створи свою анкету</h2>
        <p>Додай фото, ім'я та пару слів про себе — і починай знайомитися</p>
        <a class="cta" href="edit.html?v=6">Заповнити анкету</a>
    </div>

    <div class="placeholder" id="loading">
        <div class="emoji">⏳</div>
        <h2>Завантажую профіль...</h2>
    </div>

    <div class="placeholder" id="loadError">
        <div class="emoji">⚠️</div>
        <h2>Не вдалося завантажити</h2>
        <p>Закрий і відкрий додаток ще раз</p>
    </div>

    <div id="profileWrap" style="display: none;">
        <div class="profile-card">
            <div class="photo-area" id="photoArea">
                <img class="photo" id="cPhoto" alt="">
                <div class="photo-fallback" id="cFallback">🙂</div>
                <span class="badge" id="cBadge"></span>
                <div class="overlay">
                    <div class="name" id="cName"></div>
                    <div class="meta" id="cMeta"></div>
                    <div class="bio" id="cBio"></div>
                </div>
            </div>
        </div>
        <a class="edit-btn" href="edit.html?v=6">✏️ Редагувати анкету</a>
        <div class="view-hint">Так тебе бачать інші учасники</div>
    </div>

    <nav class="bottom-nav">
        <a href="search.html?v=9" title="Пошук анкет">🔍</a>
        <a href="index.html" class="current" title="Мій профіль">👤</a>
        <a href="bottle.html?v=24" title="Пляшечка">🍾</a>
    </nav>

    <script>
        // === Налаштування Supabase (підставлено автоматично з .env) ===
        const SUPABASE_URL = 'https://qkrrskhzrffzlnvqforg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrcnJza2h6cmZmemxudnFmb3JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4NzksImV4cCI6MjEwNDU0Njg3OX0.I-fQI5XkcrgF8-zINlqv-eYuvSaHCQjzkaLu8ueEwd4';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const tg = window.Telegram?.WebApp;
        const tgUser = tg?.initDataUnsafe?.user;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const els = {
            loading: document.getElementById('loading'),
            loadError: document.getElementById('loadError'),
            needRegister: document.getElementById('needRegister'),
            profileWrap: document.getElementById('profileWrap'),
            photo: document.getElementById('cPhoto'),
            fallback: document.getElementById('cFallback'),
            photoArea: document.getElementById('photoArea'),
            name: document.getElementById('cName'),
            meta: document.getElementById('cMeta'),
            bio: document.getElementById('cBio'),
            badge: document.getElementById('cBadge'),
        };

        function show(el) {
            [els.loading, els.loadError, els.needRegister, els.profileWrap].forEach(function (e) {
                e.style.display = 'none';
            });
            if (el) el.style.display = 'block';
        }

        let myPhotos = [];
        let photoIdx = 0;

        els.photoArea.addEventListener('click', function () {
            if (myPhotos.length < 2) return;
            photoIdx = (photoIdx + 1) % myPhotos.length;
            els.photo.src = myPhotos[photoIdx];
        });

        function renderProfile(me) {
            myPhotos = [me.photo_url, me.photo_url2].filter(Boolean);
            photoIdx = 0;

            if (myPhotos.length) {
                els.photo.src = myPhotos[0];
                els.photo.style.display = 'block';
                els.fallback.style.display = 'none';
            } else {
                els.photo.style.display = 'none';
                els.fallback.style.display = 'flex';
            }

            els.name.textContent = (me.first_name || 'Учасник') + (me.age ? ', ' + me.age : '');
            els.meta.textContent = me.city ? '📍 ' + me.city : '';
            els.bio.textContent = me.bio ? '“' + me.bio + '”' : '';
            els.bio.style.display = me.bio ? 'block' : 'none';
            const showName = me.username && me.show_username !== false;
            els.badge.textContent = showName ? '@' + me.username : '';
            els.badge.style.display = showName ? 'block' : 'none';

            show(els.profileWrap);
        }

        async function init() {
            if (!tgUser) {
                show(els.needRegister);
                return;
            }

            const { data: me, error } = await sb.from('users')
                .select('*').eq('user_id', tgUser.id).maybeSingle();

            if (error) throw error;

            if (!me) {
                show(els.needRegister);
            } else {
                renderProfile(me);
            }
        }

        show(els.loading);
        init().catch(function (err) {
            console.error(err);
            show(els.loadError);
        });
    </script>
</body>
</html>
