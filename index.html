<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мій профіль — Circles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #2d1b4e 100%);
            color: #fff;
            padding: 18px 16px calc(112px + env(safe-area-inset-bottom));
                    animation: pageIn .35s ease;
        }
        @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }

        /* М'яке світіння на фоні (статичне) */
        .orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .orbs i { position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.22; }
        .orbs i:nth-child(1) { width: 180px; height: 180px; background: #e94e77; top: 8%; left: -60px; }
        .orbs i:nth-child(2) { width: 220px; height: 220px; background: #8e44ad; bottom: 12%; right: -80px; }
        body > *:not(.orbs):not(.bottom-nav) { position: relative; z-index: 1; }
        .bottom-nav { z-index: 10; }
        .placeholder .cta { box-shadow: 0 10px 24px rgba(233, 78, 119, 0.35); }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .topbar .brand {
            font-size: 21px; font-weight: 800;
            background: linear-gradient(90deg, #ffd166, #ff7eb3, #7bdff2);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar .brand span { opacity: 0.75; font-weight: 500; font-size: 14px;
            background: none; -webkit-text-fill-color: initial; color: rgba(255,255,255,0.75); }

        .placeholder { text-align: center; padding: 70px 16px; display: none; }
        .placeholder .emoji { font-size: 58px; }
        .placeholder h2 { font-size: 19px; margin: 16px 0 8px; }
        .placeholder p { font-size: 14px; opacity: 0.65; line-height: 1.55; }
        .placeholder .cta {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 30px;
            border-radius: 14px;
            background: linear-gradient(90deg, #e94e77, #b83060);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        /* Картка профілю — така сама, як у пошуку */
        .profile-card {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background: #20203a;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }
        .photo-area { position: relative; width: 100%; aspect-ratio: 3/4; }
        .photo-area .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-area .photo-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 96px;
            background: linear-gradient(160deg, #e94e77, #8e44ad);
        }

        .photo-dots {
            position: absolute;
            top: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .photo-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            transition: background 0.2s, transform 0.2s;
        }
        .photo-dots span.active { background: #fff; transform: scale(1.15); }

        .badge {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 56px 18px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.55) 45%, rgba(0, 0, 0, 0.82) 100%);
        }
        .overlay .name { font-size: 24px; font-weight: 800; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); }
        .overlay .meta {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
            margin-top: 3px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
        }
        .overlay .bio {
            font-size: 13.5px;
            line-height: 1.5;
            font-style: italic;
            opacity: 0.85;
            margin-top: 9px;
        }

        .edit-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #e94e77, #b83060);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 10px 26px rgba(214, 51, 108, 0.35);
            transition: transform 0.15s;
        }
        .edit-btn:active { transform: scale(0.97); }

        .view-hint {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            opacity: 0.5;
        }

        /* Нижнє меню: 🔍 зліва, 🍾 справа */
        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
            background: rgba(15, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .bottom-nav a {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.15s, background 0.15s;
        }
        .bottom-nav a:active { transform: scale(0.9); background: rgba(233, 78, 119, 0.25); }
    </style>
</head>
<body>
    <div class="orbs"><i></i><i></i></div>

    <div class="topbar">
        <div class="brand">💫 Circles <span>— мій профіль</span></div>
    </div>

    <!-- Стан: ще немає анкети -->
    <div class="placeholder" id="needRegister">
        <div class="emoji">📝</div>
        <h2>Створи свою анкету</h2>
        <p>Додай фото, ім'я та пару слів про себе — і починай знайомитися</p>
        <a class="cta" href="edit.html?v=4">Заповнити анкету ✨</a>
    </div>

    <!-- Стан: завантаження -->
    <div class="placeholder" id="loading">
        <div class="emoji">⏳</div>
        <h2>Завантажую профіль...</h2>
    </div>

    <!-- Стан: помилка -->
    <div class="placeholder" id="loadError">
        <div class="emoji">⚠️</div>
        <h2>Не вдалося завантажити</h2>
        <p>Закрий і відкрий додаток ще раз</p>
    </div>

    <!-- Профіль -->
    <div id="profileWrap" style="display: none;">
        <div class="profile-card">
            <div class="photo-area" id="photoArea">
                <img class="photo" id="cPhoto" alt="">
                <div class="photo-fallback" id="cFallback">🙂</div>
                <div class="photo-dots" id="cDots"></div>
                <span class="badge" id="cBadge"></span>
                <div class="overlay">
                    <div class="name" id="cName"></div>
                    <div class="meta" id="cMeta"></div>
                    <div class="bio" id="cBio"></div>
                </div>
            </div>
        </div>
        <a class="edit-btn" href="edit.html?v=4">✏️ Редагувати анкету</a>

    <nav class="bottom-nav">
        <a href="search.html?v=6" title="Пошук анкет">🔍</a>
        <a href="bottle.html?v=15" title="Пляшечка">🍾</a>
    </nav>

    <script>
        // === Налаштування Supabase (підставлено автоматично з .env) ===
        const SUPABASE_URL = 'https://qkrrskhzrffzlnvqforg.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrcnJza2h6cmZmemxudnFmb3JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4NzksImV4cCI6MjEwNDU0Njg3OX0.I-fQI5XkcrgF8-zINlqv-eYuvSaHCQjzkaLu8ueEwd4';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const tg = window.Telegram?.WebApp;
        const tgUser = tg?.initDataUnsafe?.user;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const els = {
            loading: document.getElementById('loading'),
            loadError: document.getElementById('loadError'),
            needRegister: document.getElementById('needRegister'),
            profileWrap: document.getElementById('profileWrap'),
            photo: document.getElementById('cPhoto'),
            fallback: document.getElementById('cFallback'),
            dots: document.getElementById('cDots'),
            photoArea: document.getElementById('photoArea'),
            name: document.getElementById('cName'),
            meta: document.getElementById('cMeta'),
            bio: document.getElementById('cBio'),
            badge: document.getElementById('cBadge'),
        };

        function show(el) {
            [els.loading, els.loadError, els.needRegister, els.profileWrap].forEach(function (e) {
                e.style.display = 'none';
            });
            if (el) el.style.display = 'block';
        }

        let myPhotos = [];
        let photoIdx = 0;

        // Тап по фото — перемикання між своїми фото
        els.photoArea.addEventListener('click', function () {
            if (myPhotos.length < 2) return;
            photoIdx = (photoIdx + 1) % myPhotos.length;
            els.photo.src = myPhotos[photoIdx];
            els.dots.querySelectorAll('span').forEach(function (d, i) {
                d.classList.toggle('active', i === photoIdx);
            });
        });

        function renderProfile(me) {
            myPhotos = [me.photo_url, me.photo_url2].filter(Boolean);
            photoIdx = 0;

            if (myPhotos.length) {
                els.photo.src = myPhotos[0];
                els.photo.style.display = 'block';
                els.fallback.style.display = 'none';
            } else {
                els.photo.style.display = 'none';
                els.fallback.style.display = 'flex';
            }

            els.dots.innerHTML = '';
            myPhotos.forEach(function (_, i) {
                const dot = document.createElement('span');
                if (i === 0) dot.classList.add('active');
                els.dots.appendChild(dot);
            });
            els.dots.style.display = myPhotos.length > 1 ? 'flex' : 'none';

            els.name.textContent = (me.first_name || 'Учасник') + (me.age ? ', ' + me.age : '');
            els.meta.textContent = me.city ? '📍 ' + me.city : '';
            els.bio.textContent = me.bio ? '“' + me.bio + '”' : '';
            els.bio.style.display = me.bio ? 'block' : 'none';
            const showName = me.username && me.show_username !== false;
            els.badge.textContent = showName ? '@' + me.username : '';
            els.badge.style.display = showName ? 'block' : 'none';

            show(els.profileWrap);
        }

        async function init() {
            if (!tgUser) {
                show(els.needRegister);
                return;
            }

            const { data: me, error } = await sb.from('users')
                .select('*').eq('user_id', tgUser.id).maybeSingle();

            if (error) throw error;

            if (!me) {
                show(els.needRegister);
            } else {
                renderProfile(me);
            }
        }

        show(els.loading);
        init().catch(function (err) {
            console.error(err);
            show(els.loadError);
        });
    </script>
</body>
</html>
